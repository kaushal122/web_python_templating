<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
</head>
<body>
    <h2>Users Registered</h2>
    <ul>
        {% for user in users %}
            <li>{{user.name}} ({{user.age}} years old) and his mail is {{user.email}} 
                <ul>His/Her password Is <li>Password: {{user.password}}</li></ul>
            </li>
            
        {% endfor %}
    </ul>
    
</body>
</html>
